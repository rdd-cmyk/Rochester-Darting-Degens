<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDD · League front door concept</title>
<style>
:root{--rdd-navy:#08264d;--rdd-orange:#f47c20;--rdd-ink:#101827;--rdd-muted:#5b6472;--rdd-panel:#fff;--rdd-page:#f4f1eb;--rdd-border:#d8dce3;--rdd-positive:#1b5f94;--rdd-space-4:1rem;--rdd-space-6:1.5rem;--rdd-radius-panel:1rem;--rdd-panel-padding:clamp(1rem,2vw,1.5rem);--rdd-shell-padding:clamp(1rem,3vw,2.5rem);--rdd-page-title-size:clamp(1.75rem,3vw,2.5rem);--rdd-page-title-line-height:1.14;--input-border:#858c98;--focus-ring:#0366d6}
[data-theme=dark]{--rdd-orange:#ff9344;--rdd-ink:#f4f6f8;--rdd-muted:#b9c2ce;--rdd-panel:#111b2b;--rdd-page:#080f1a;--rdd-border:#2b3b52;--rdd-positive:#73baff;--input-border:#76869b;--focus-ring:#60a5fa}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 Arial,Helvetica,sans-serif;background:var(--rdd-page);color:var(--rdd-ink)}button,input,select{font:inherit}button,a,summary{touch-action:manipulation}button,a{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus-ring);outline-offset:3px}
button,.button{min-height:44px;padding:.55rem 1rem;border:1px solid var(--input-border);border-radius:.55rem;background:var(--rdd-panel);color:var(--rdd-ink);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}button:hover,.button:hover{filter:brightness(.96)}.primary{background:var(--rdd-orange);border-color:var(--rdd-orange);color:#1d1a16}.link{padding:0;border:0;background:none;color:var(--rdd-positive);text-decoration:underline;text-underline-offset:4px}.quiet{background:none;border-color:transparent}.lab{padding:.6rem max(1rem,calc((100% - 1200px)/2));background:var(--rdd-navy);color:#fff3dc;display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:.8rem}.lab button{font-size:.8rem;min-height:36px}.nav{position:relative;border-bottom:1px solid var(--rdd-border);background:var(--rdd-panel)}.nav-inner{max-width:1200px;margin:auto;padding:.6rem var(--rdd-shell-padding);display:flex;align-items:center;gap:1.2rem}.brand{padding:0;border:0;background:none}.brand img{width:42px;height:42px;object-fit:contain}.nav nav{display:flex;gap:.2rem;flex:1}.nav nav button{border:0;background:none;padding:.5rem .7rem;font-size:.88rem;white-space:nowrap}.nav nav button[aria-current=page]{color:var(--rdd-positive);box-shadow:inset 0 -3px var(--rdd-orange)}.profile{padding:0;width:44px;border-radius:50%;overflow:hidden}.profile img{width:100%}.menu{display:none}
main>*{min-width:0}main{grid-template-columns:minmax(0,1fr);min-width:0;max-width:1200px;margin:auto;padding:var(--rdd-shell-padding);display:grid;gap:var(--rdd-space-6)}header.page{display:grid;gap:.3rem}header.page>.row{min-height:52px}.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--rdd-muted)}h1{font-size:var(--rdd-page-title-size);line-height:var(--rdd-page-title-line-height);letter-spacing:-.025em;margin:0;font-weight:800}h1 span{color:var(--rdd-orange)}h2{font-size:clamp(1.3rem,2vw,1.7rem);line-height:1.25;letter-spacing:-.02em;margin:0}h3{font-size:1.05rem;margin:0}p{margin:.3rem 0 0}.description{max-width:68ch;min-height:3.2rem;color:var(--rdd-muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:1rem}.actions{display:flex;gap:.65rem;flex-wrap:wrap}.panel{min-width:0;background:var(--rdd-panel);border:1px solid var(--rdd-border);border-radius:var(--rdd-radius-panel);padding:var(--rdd-panel-padding)}.muted{color:var(--rdd-muted)}.small{font-size:.83rem}.stack{display:grid;gap:1rem}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:var(--rdd-space-6)}.feature{border-top:4px solid var(--rdd-orange)}.feature h2{font-size:1.9rem;margin:.4rem 0}.feature .actions{margin-top:1.3rem}.badge{display:inline-block;padding:.2rem .65rem;border-radius:2rem;background:var(--rdd-page);font-size:.75rem;font-weight:700}.night-meta{display:flex;flex-wrap:wrap;gap:.5rem 1.3rem;margin:.75rem 0;color:var(--rdd-muted)}.section-head{margin-bottom:1rem}.list-row{padding:.9rem 0;border-top:1px solid var(--rdd-border)}.list-row:first-child{border-top:0}.person{display:flex;gap:.7rem;align-items:center}.person img{height:44px;width:44px;object-fit:contain;background:var(--rdd-page);border-radius:50%}.number{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}.tabs{display:flex;gap:.5rem;flex-wrap:wrap}.tabs button[aria-pressed=true]{background:var(--rdd-navy);color:#fff3dc;border-color:var(--rdd-navy)}.filters{display:flex;gap:1rem;flex-wrap:wrap;align-items:end}.filters label{flex:1;min-width:130px;font-size:.8rem;font-weight:700}select,input{display:block;width:100%;min-height:44px;padding:.55rem;border:1px solid var(--input-border);border-radius:.5rem;background:var(--rdd-panel);color:var(--rdd-ink)}.scroll{overflow:auto;min-width:0;max-width:100%}table{border-collapse:collapse;width:100%;font-size:.9rem}th{text-align:left;font-size:.75rem;color:var(--rdd-muted)}td,th{padding:.85rem .7rem;border-bottom:1px solid var(--rdd-border);white-space:nowrap}th:first-child,td:first-child{padding-left:0}tr:last-child td{border-bottom:0}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.metric-grid strong{font-size:1.55rem;display:block}.trend{height:125px;width:100%;color:var(--rdd-positive)}.match{padding:1rem 0;border-top:1px solid var(--rdd-border)}.match:first-of-type{border-top:0}.match summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:60px}.match summary::-webkit-details-marker{display:none}.winner{font-weight:800}.match .detail{margin-top:.8rem;padding:1rem;background:var(--rdd-page);border-radius:.5rem}.result{font-size:.8rem;font-weight:700;white-space:nowrap}.note{border-left:3px solid var(--rdd-orange);padding:.6rem 1rem;background:var(--rdd-panel);font-size:.85rem}.empty{padding:2rem;text-align:center}.hidden{display:none!important}dialog{max-width:620px;width:calc(100% - 2rem);max-height:90vh;overflow:auto;background:var(--rdd-panel);color:var(--rdd-ink);border:1px solid var(--rdd-border);border-radius:1rem;padding:1.5rem}dialog::backdrop{background:#080f1aa8}.dialog-top{margin-bottom:1rem}.form{display:grid;gap:1rem}.form label{font-size:.85rem;font-weight:700}.notice{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);max-width:calc(100% - 2rem);padding:.8rem 1.2rem;background:var(--rdd-navy);color:#fff3dc;border-radius:.5rem;z-index:4}.logo-small{width:52px;height:52px;object-fit:contain}.intro{display:flex;gap:1rem;align-items:center}.footer{max-width:1200px;margin:0 auto;padding:1rem var(--rdd-shell-padding) 2rem;color:var(--rdd-muted);font-size:.8rem}
@media(max-width:1000px){.nav nav{display:none}.nav nav.open{display:flex;position:absolute;top:100%;left:0;right:0;background:var(--rdd-panel);padding:1rem;flex-wrap:wrap;z-index:3;border-bottom:1px solid var(--rdd-border)}.menu{display:inline-flex;margin-left:auto}}
@media(max-width:640px){.grid,.metric-grid{grid-template-columns:1fr}.lab{align-items:flex-start}.lab>span{max-width:230px}.row{align-items:flex-start;flex-wrap:wrap}.description{min-height:6.4rem}.feature h2{font-size:1.55rem}.filters{gap:.6rem}.filters label{min-width:calc(50% - .6rem)}.match summary{align-items:flex-start}.number{font-size:1.15rem}.lab button{padding:.3rem .55rem}.nav-inner{gap:.8rem}.intro{align-items:flex-start}.tabs button{flex:1;font-size:.8rem;padding:.5rem}.actions button{flex-grow:1}}
</style></head><body>
<div class="lab"><span><strong>DESIGN STUDY</strong> · Sample league, fictional results. Nothing saves.</span><button id="theme">Dark appearance</button></div>
<div class="nav"><div class="nav-inner"><button class="brand" data-page="night" aria-label="League Night landing"><img src="../../public/rdd-navbar-logo.png" alt="RDD"></button><button class="menu" aria-expanded="false">☰ Menu</button><nav aria-label="Proposed main navigation"><button data-page="night">League Night</button><button data-page="matches">Matches</button><button data-page="stats">Stats</button><button data-note="Rivalry Room stays as it is in this proposal.">Rivalry Room</button><button data-note="Players stays as it is in this proposal.">Players</button><button data-note="League Board stays as it is in this proposal.">League Board</button><button data-note="Solo stays as it is in this proposal.">Solo</button></nav><button class="profile" data-note="Account settings are outside this mockup." aria-label="Your account"><img src="../../public/avatars/robot-96.webp" alt=""></button></div></div>
<main id="main"></main><div class="footer">Concept only · Shared palette, heading size, shell and control roles from the current style guide. W6–W8 remain at their saved checkpoint.</div>
<dialog id="editor"><div class="row dialog-top"><h2 id="dialog-title">Record a standalone match</h2><button id="close" aria-label="Close dialog">✕</button></div><div id="dialog-body"></div></dialog><div id="notice" class="notice hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s);let page='night',stats='power',night='between',theme='light';const portraits={Alex:'fox',Morgan:'robot',Jamie:'red-panda',Casey:'alien'};const people=[['Alex',1246,'12–6','18','Established'],['Morgan',1218,'10–7','17','Established'],['Jamie',1179,'6–4','10','Provisional'],['Casey',1158,'7–9','16','Established']];
function person(n){return '<span class="person"><img src="../../public/avatars/'+portraits[n]+'-96.webp" alt=""><strong>'+n+'</strong></span>'}
function header(title,desc,eyebrow='Rochester Darting Degens'){return '<header class="page"><div class="row"><span class="eyebrow">'+eyebrow+'</span>'+(title==='League Night'?'<img class="logo-small" src="../../public/rdd-logo.png" alt="Rochester Darting Degens logo">':'')+'</div><h1>'+title+'<span>.</span></h1><p class="description">'+desc+'</p></header>'}
function powerTable(){return '<div class="scroll"><table><thead><tr><th>Rank / Player</th><th>Power</th><th>Record</th><th>Evidence games</th><th>Status</th></tr></thead><tbody>'+people.map((p,i)=>'<tr><td><div class="person"><span class="muted">'+(i+1)+'</span>'+person(p[0])+'</div></td><td class="number">'+p[1]+'</td><td>'+p[2]+'</td><td>'+p[3]+'</td><td>'+p[4]+'</td></tr>').join('')+'</tbody></table></div>'}
function nightPage(){let playing=night==='playing',empty=night==='empty';return header('League Night','The next night, the latest results, and your way to the board.')+
'<div class="row"><div class="actions"><button data-open="start">Start a night</button><button data-note="The existing planning page would open here.">Plan a night</button></div><label class="small muted">Preview state <select id="night-state"><option value="between">Between nights</option><option value="playing">Playing tonight</option><option value="empty">No upcoming plan</option></select></label></div>'+
'<div class="grid"><section class="panel feature"><span class="eyebrow">'+(playing?'Tonight’s league night':empty?'Next up':'The next league night')+'</span><h2>'+(playing?'Friday at the oche':empty?'The next night is yours to call.':'Friday at the oche')+'</h2><p class="muted">'+(empty?'Nothing planned yet. Start the conversation, pick a date, and get the league together.':playing?'The board is ready. Keep tonight’s results together.':'A spot at the board and another shot at the bragging rights.')+'</p>'+(!empty?'<div class="night-meta"><span>Fri, Oct 9 · 7:00 PM</span><span>The Clubhouse</span></div><span class="badge">'+(playing?'4 checked in · 6 matches recorded':'4 going · You’re going')+'</span>':'')+'<div class="actions"><button class="primary" '+(playing?'data-open="night"':empty?'data-note="The existing planning page would open here."':'id="rsvp"')+'>'+(playing?'Open tonight & record':empty?'Plan the next night':'Change my RSVP')+'</button>'+(!empty?'<button data-note="The existing plan detail would open here.">View plan</button>':'')+'</div></section>'+
'<section class="panel"><div class="row section-head"><h2>The power picture</h2><button class="link" data-page="stats">Full Stats →</button></div><p class="small muted">Overall power · current recorded history</p>'+people.slice(0,3).map((p,i)=>'<div class="row list-row"><div class="person"><span class="muted">'+(i+1)+'</span>'+person(p[0])+'</div><span class="number">'+p[1]+'</span></div>').join('')+'<p class="small muted">Jamie’s rating is provisional. Full evidence and filters live in Stats.</p></section></div>'+
'<div class="grid"><section class="panel"><div class="row section-head"><h2>Last time at the board</h2><span class="badge">Recap</span></div><h3>September showdown</h3><p class="muted small">Sep 25 · The Clubhouse · 8 matches</p><p>Alex took 3 of 4. Morgan won the final rematch.</p><div class="actions" style="margin-top:1rem"><button data-open="recap">Open the recap</button><button class="link" data-page="matches">See the matches →</button></div></section><section class="panel"><div class="row section-head"><h2>From the League Board</h2><button class="link" data-note="The existing League Board would open here.">Open Board →</button></div><h3>Friday’s rematch is on.</h3><p class="muted small">Morgan · Sample post</p><p>Same board. Fresh chance to settle it.</p></section></div>'+
'<section class="panel"><div class="row section-head"><h2>Previous nights</h2><button class="link" data-note="This would open the complete night archive.">All nights →</button></div>'+['September showdown · Sep 25 · 8 matches','Late-summer rematch · Sep 11 · 12 matches'].map(t=>'<div class="row list-row"><strong>'+t+'</strong><button data-open="recap">Open night</button></div>').join('')+'</section>'}
function statsPage(){return header('Stats','The league picture, the records behind it, and the rivalries worth watching.')+'<div class="tabs" aria-label="Statistics views">'+[['power','Power & Performance'],['records','Records'],['head','Head to Head']].map(t=>'<button data-stats="'+t[0]+'" aria-pressed="'+(stats===t[0])+'">'+t[1]+'</button>').join('')+'</div><section class="panel filters"><label>History<select><option>All recorded history</option><option>Last 90 days</option></select></label><label>Game<select><option>All games</option><option>501</option><option>301</option><option>701</option><option>Cricket</option></select></label><label>Format<select><option>All formats</option><option>Singles</option><option>2v2</option><option>3v3</option></select></label><label>Minimum games<select><option>3+</option><option>1+</option><option>10+</option></select></label></section>'+ (stats==='power'?'<div class="metric-grid"><section class="panel"><span class="eyebrow">Power leader</span><h2>Alex</h2><strong>1,246</strong><p class="small muted">18 evidence games · established</p></section><section class="panel"><span class="eyebrow">Recent form</span><h2>Morgan</h2><strong>4 wins in 5</strong><p class="small muted">Latest five eligible results</p></section><section class="panel"><span class="eyebrow">The closest contest</span><h2>Alex / Morgan</h2><strong>3–2</strong><p class="small muted">Their last five head-to-head games</p></section></div><section class="panel"><div class="row section-head"><h2>Power leaderboard</h2><button class="link" data-note="Existing rating methodology and exact evidence would appear here.">How it works</button></div>'+powerTable()+'</section><section class="panel"><h2>Power rating history</h2><p class="small muted">Illustrative chart · Alex’s recorded rating trajectory</p><svg class="trend" viewBox="0 0 900 125" role="img" aria-label="Sample rating rises from 1200 to 1246 over five nights"><path d="M0 95H900 M0 55H900 M0 15H900" stroke="currentColor" opacity=".15"/><path d="M10 100 L180 82 L350 91 L520 54 L700 37 L890 14" fill="none" stroke="currentColor" stroke-width="3"/></svg><details><summary>Exact sample values</summary><p>1,200 → 1,212 → 1,207 → 1,229 → 1,239 → 1,246</p></details></section><section class="note">The existing score consistency, distributions and rating explanations continue below. This concept changes navigation and emphasis, not how ratings are calculated.</section>':stats==='records'?records():headToHead())}
function gameRecordTable(){return '<div class="scroll"><table><thead><tr><th>Player</th><th>Wins</th><th>Losses</th><th>Games</th><th>Win %</th><th>Streak</th><th>Last 5</th><th>Last 10</th></tr></thead><tbody>'+people.map((p,i)=>'<tr><td>'+person(p[0])+'</td><td>'+[8,6,4,3][i]+'</td><td>'+[3,4,3,5][i]+'</td><td>'+[11,10,7,8][i]+'</td><td>'+[72.7,60,57.1,37.5][i]+'%</td><td>W1</td><td>3–2</td><td>6–4</td></tr>').join('')+'</tbody></table></div>'}
function records(){return '<section class="note">Every leaderboard from the old Home page has a home here. These are supporting records; Power & Performance stays the default Stats view.</section><section class="panel"><div class="row section-head"><h2>Overall record</h2><label class="small">Sort by<select id="record-sort"><option>Win percentage</option><option>Wins</option></select></label></div><div class="scroll"><table><thead><tr><th>Player</th><th>Wins</th><th>Losses</th><th>Games</th><th>Win %</th><th>Streak</th><th>Last 5</th><th>Last 10</th></tr></thead><tbody>'+people.map((p,i)=>'<tr><td>'+person(p[0])+'</td><td>'+[12,10,6,7][i]+'</td><td>'+[6,7,4,9][i]+'</td><td>'+p[3]+'</td><td>'+[66.7,58.8,60,43.8][i]+'%</td><td>W2</td><td>3–2</td><td>6–4</td></tr>').join('')+'</tbody></table></div></section><section class="panel"><div class="row section-head"><h2>Game-type record</h2><select aria-label="Record game type" style="width:140px"><option>501</option><option>301</option><option>701</option><option>Cricket</option><option>Other</option></select></div><p class="muted">The same wins, losses, streaks and recent results, for the selected game.</p>'+gameRecordTable()+'</section><div class="grid"><section class="panel"><h2>3-dart averages</h2><p class="small muted">Legacy singles · unspecified rules · 501 selected</p>'+['Alex · 52.4 · 8 recorded scores','Morgan · 49.8 · 7 recorded scores'].map(t=>'<div class="list-row">'+t+'</div>').join('')+'<button class="link" data-stats="power">Explore comparable score groups →</button></section><section class="panel"><h2>Cricket MPR</h2><p class="small muted">Legacy singles · unspecified rules</p><div class="list-row">Jamie · 2.1 · 4 recorded scores</div><div class="list-row">Alex · 1.9 · 6 recorded scores</div><p class="small muted">Missing scores are excluded, not treated as zero.</p></section></div>'}
function headToHead(){return '<section class="panel"><div class="filters"><label>Player<select><option>Alex</option><option>Morgan</option></select></label><label>Opponent<select><option>Morgan</option><option>Jamie</option><option>Casey</option></select></label></div><div class="row" style="padding:2rem 0">'+person('Alex')+'<strong class="number">3 – 2</strong>'+person('Morgan')+'</div><p class="muted">Alex leads their latest five games. Full recorded head-to-head: Alex 5, Morgan 4.</p><div class="actions" style="margin-top:1rem"><button data-note="The existing Rivalry Room pair view would open here.">Open this rivalry</button><button data-page="matches">Find their matches</button></div></section><section class="panel"><h2>Alex against the league</h2><div class="scroll"><table><thead><tr><th>Opponent</th><th>Wins</th><th>Losses</th><th>Win %</th><th>Streak</th><th>Last 5</th><th>Last 10</th></tr></thead><tbody><tr><td>Morgan</td><td>5</td><td>4</td><td>55.6%</td><td>W1</td><td>3–2</td><td>5–4</td></tr><tr><td>Jamie</td><td>4</td><td>2</td><td>66.7%</td><td>W2</td><td>3–2</td><td>4–2</td></tr></tbody></table></div></section>'}
const games=[{a:'Alex',b:'Morgan',game:'501',night:'September showdown',date:'Sep 25 · 9:18 PM',score:'Alex 52.4 · Morgan 49.8',format:'Singles'},{a:'Jamie',b:'Casey',game:'Cricket',night:'September showdown',date:'Sep 25 · 8:42 PM',score:'Jamie 2.1 MPR · Casey 1.7 MPR',format:'Singles'},{a:'Morgan + Casey',b:'Alex + Jamie',game:'701',night:'Late-summer rematch',date:'Sep 11 · 8:30 PM',score:'Shared team result · no personal score averages',format:'2v2'},{a:'Morgan',b:'Alex',game:'301',night:'Standalone match',date:'Sep 6 · 7:15 PM',score:'No scores recorded',format:'Singles'}];
function matchRows(){let game=$('#game-filter')?.value||'All games',who=$('#player-filter')?.value||'All players',source=$('#source-filter')?.value||'All nights';let filtered=games.filter(g=>(game==='All games'||g.game===game)&&(who==='All players'||(g.a+' '+g.b).includes(who))&&(source==='All nights'||g.night===source));if($('#match-count'))$('#match-count').textContent=filtered.length+' illustrative '+(filtered.length===1?'match':'matches');return filtered.length?filtered.map(g=>'<details class="match"><summary><span><span class="winner">'+g.a+'</span> defeated '+g.b+'<br><span class="small muted">'+g.game+' · '+g.format+' · '+g.date+'<br>'+g.night+'</span></span><span class="result">View details +</span></summary><div class="detail"><p>'+g.score+'</p><p class="small muted">Sample match #104 · recorded by Morgan · revision 1</p><div class="actions" style="margin-top:.8rem"><button data-open="edit">Edit result</button>'+(g.night!=='Standalone match'?'<button data-open="recap">Open league night</button>':'')+'</div></div></details>').join(''):'<div class="empty"><h3>No matches in this selection.</h3><p class="muted">Try another player or game.</p><button id="reset-filters">Clear filters</button></div>'}
function matchesPage(){return header('Matches','Every result has a story. Find the game, check the details, or correct the record.')+'<div class="row"><div class="actions"><button class="primary" data-page="night">Record through League Night</button><button class="link" data-open="standalone">Record a standalone match</button></div><span class="small muted">Practice belongs in Solo.</span></div><section class="panel filters"><label>Player<select id="player-filter"><option>All players</option>'+people.map(p=>'<option>'+p[0]+'</option>').join('')+'</select></label><label>Game<select id="game-filter"><option>All games</option><option>301</option><option>501</option><option>701</option><option>Cricket</option></select></label><label>League night<select id="source-filter"><option>All nights</option><option>September showdown</option><option>Late-summer rematch</option><option>Standalone match</option></select></label><label>Date range<select data-demo-filter><option>All dates</option><option>Last 30 days</option></select></label></section><section class="panel"><div class="row section-head"><h2>Match archive</h2><span class="small muted" id="match-count">4 illustrative matches</span></div><div id="match-list">'+matchRows()+'</div></section><p class="small muted">Only people with the existing correction permission would see Edit result. Uncertain saves and recovery remain supported in the real app.</p>'}
function render(){ $('#main').innerHTML=page==='night'?nightPage():page==='stats'?statsPage():matchesPage();document.querySelectorAll('nav [data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));if($('#night-state'))$('#night-state').value=night;document.title='RDD concept · '+(page==='night'?'League Night':page==='stats'?'Stats':'Matches');}
function notify(t){$('#notice').textContent=t;$('#notice').classList.remove('hidden');clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>$('#notice').classList.add('hidden'),4500)}
function openDialog(mode){let title='',body='';if(mode==='standalone'){title='Where did this game happen?';body='<div class="stack"><div class="panel feature"><h3>Part of a league night?</h3><p class="muted">Record there to keep attendance, results and the recap together.</p><button class="primary" data-page="night" style="margin-top:1rem">Choose a league night</button></div><div><h3>A competitive game outside a night</h3><p class="muted">Use standalone recording for a separate game or an older result.</p><button data-open="form" style="margin-top:.7rem">Continue with standalone</button></div><p class="small muted">Solo practice? Use the existing Solo page.</p></div>'}else if(mode==='form'||mode==='edit'){title=mode==='edit'?'Correct a recorded result':'Record a standalone match';body='<form class="form" id="demo-form"><p class="small muted">Concept form · no information will be saved.</p><label>Game<select><option>301</option><option selected>501</option><option>701</option><option>Cricket</option></select></label><label>Format<select><option>Singles</option><option>2v2</option><option>3v3</option></select></label><div class="filters"><label>Player / side A<select><option>Alex</option><option>Morgan</option></select></label><label>Player / side B<select><option>Morgan</option><option>Jamie</option></select></label></div><label>Winner<select><option>Alex</option><option>Morgan</option></select></label><label>Played at<input type="datetime-local" value="2026-10-09T19:30"></label><details><summary>Scores and additional details</summary><p class="small muted">The existing game-specific score controls, rules, venue, notes and correction preview would be retained here.</p></details><button class="primary" type="submit">'+(mode==='edit'?'Preview correction':'Review result')+'</button></form>'}else if(mode==='start'){title='Start a league night';body='<form class="form" id="demo-form"><label>Night name<input value="Friday at the oche"></label><label>Date<input type="date" value="2026-10-09"></label><label>Venue · optional<input value="The Clubhouse"></label><button type="submit" class="primary">Start night & choose who’s here</button></form>'}else{title=mode==='recap'?'September showdown':'Friday at the oche';body='<div class="stack"><p class="muted">'+(mode==='recap'?'Sep 25 · The Clubhouse · 8 recorded matches':'Oct 9 · The Clubhouse · 4 checked in')+'</p><p>'+(mode==='recap'?'The existing night workspace and recap open here, preserving match history, awards and share cards.':'The existing night workspace opens here, with shared attendance, quick match entry and Save & Rematch.')+'</p><button class="primary" data-note="The night workspace is intentionally retained; this mockup explores its front door.">View existing workspace concept</button></div>'}$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;if(!$('#editor').open)$('#editor').showModal()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;$('#editor').close();render();$('nav').classList.remove('open');$('.menu').setAttribute('aria-expanded','false');window.scrollTo(0,0)}if(b.dataset.stats){stats=b.dataset.stats;render()}if(b.dataset.note)notify(b.dataset.note);if(b.dataset.open)openDialog(b.dataset.open);if(b.id==='close')$('#editor').close();if(b.id==='theme'){theme=theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;b.textContent=theme==='dark'?'Light appearance':'Dark appearance'}if(b.classList.contains('menu')){let on=$('nav').classList.toggle('open');b.setAttribute('aria-expanded',String(on))}if(b.id==='rsvp'){b.textContent=b.textContent==='Change my RSVP'?'You’re not going · Change RSVP':'Change my RSVP';notify('Sample RSVP toggled locally. Nothing was submitted.')}if(b.id==='reset-filters'){document.querySelectorAll('.filters select').forEach(s=>s.selectedIndex=0);$('#match-list').innerHTML=matchRows()}});
document.addEventListener('change',e=>{if(e.target.id==='night-state'){night=e.target.value;render()}else if(['game-filter','player-filter','source-filter'].includes(e.target.id))$('#match-list').innerHTML=matchRows();else notify('Layout preview: this control illustrates the existing filter. Sample statistics are not recalculated.')});
document.addEventListener('submit',e=>{e.preventDefault();notify('Mockup only — no result or night was saved.');$('#editor').close()});render();
</script></body></html>
